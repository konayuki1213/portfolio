<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #f4f4f4;
  color: #333;
}

/* ===== ヘッダー ===== */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  background: #fff;
  padding: 20px;
  border-bottom: 1px solid #ddd;
}

header a {
  text-decoration: none;
  color: #000;
  font-weight: bold;
  text-align: center;
}

header a:hover {
  opacity: 0.5;
}

/* ===== メイン ===== */
.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px 20px;
}

.box {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  height: 400px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.left, .right {
  width: 250px;
}

.center {
  width: 500px;
  padding: 30px;
  text-align: center;
}

/* 画像 */
img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

img:hover {
  transform: scale(1.05);
}

/* ===== SNS部分 ===== */
.sns-section {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px 20px;
}

.sns-box {
  width: 180px;
  height: 110px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
  box-shadow: 0 8px 15px rgba(0,0,0,0.1);
}

.sns-box:hover {
  transform: translateY(-5px);
}

/* Instagram */
.instagram {
  background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
  color: #fff;
}

/* TikTok */
.tiktok {
  background: #000;
  color: #0ff;
}

/* X */
.x {
  background: #000;
  color: #fff;
}

/* ===== スマホ ===== */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .left, .center, .right {
    width: 90%;
  }

  .sns-section {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">ポートフォリオ</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <div class="box left">
    <img src="image1.jpg">
  </div>

  <div class="box center">
    <h2>自己紹介</h2>
    <p>
      はじめまして。<br>
      Web制作を勉強中です。<br><br>
      シンプルで見やすいサイトを作るのが好きです。
    </p>
  </div>

  <div class="box right">
    <img src="image2.jpg">
  </div>

</div>

<!-- ✅ SNS（画像なし版） -->
<div class="sns-section">

  <a href="https://instagram.com" class="sns-box instagram">
    📸 Instagram
  </a>

  <a href="https://tiktok.com" class="sns-box tiktok">
    🎵 TikTok
  </a>

  <a href="https://x.com" class="sns-box x">
    ✖ X
  </a>

</div>

</body>
</html>
