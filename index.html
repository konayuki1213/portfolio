<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  color: #fff;

  background-image: url("bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* 背景暗くして雰囲気 */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}

/* ヘッダー */
header {
  display: flex;
  justify-content: center;
  gap: 60px;
  padding: 25px;
  letter-spacing: 2px;
}

header a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

/* メイン */
.main {
  height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* カード */
.card {
  max-width: 520px;
  padding: 40px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  text-align: center;
}

/* タイトル */
.card h1 {
  font-size: 22px;
  margin-bottom: 25px;
}

/* テキスト */
.card p {
  font-size: 14px;
  line-height: 2;
  color: #ddd;
}

/* SNS */
.sns-section {
  display: flex;
  justify-content: center;
  gap: 25px;
  padding: 40px;
}

/* ボタン */
.sns-box {
  width: 160px;
  height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 15px;
  text-decoration: none;

  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);

  color: #fff;
  font-weight: bold;

  border: 1px solid rgba(255,255,255,0.2);

  transition: 0.3s;
}

/* ホバー */
.sns-box:hover {
  transform: translateY(-8px) scale(1.05);
}

/* Instagram */
.instagram {
  background: linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}

/* TikTok */
.tiktok {
  color: #00f7ff;
  text-shadow: 0 0 8px #00f7ff;
}

/* X */
.x {
  letter-spacing: 2px;
}

/* スマホ */
@media (max-width:768px) {
  .sns-section {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="main">
  <div class="card">
    <h1>自己紹介</h1>
    <p>
      ご覧いただきありがとうございます。<br><br>

      日々、写真の撮影と編集を行っています。<br><br>

      このサイトでは、<br>
      これまでに撮影した作品をまとめています。
    </p>
  </div>
</div>

<div class="sns-section">

  <a href="https://instagram.com" class="sns-box instagram" target="_blank">
    Instagram
  </a>

  <a href="https://www.tiktok.com/@matsutart?lang=ja-JP" class="sns-box tiktok" target="_blank">
    TikTok
  </a>

  <a href="https://x.com/matsuu_jp" class="sns-box x" target="_blank">
    X
  </a>

</div>

</body>
</html>
``
