<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  color: #fff;

  background-image: url("bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* 背景暗くする */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

/* ヘッダー */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 20px;
}

header a {
  text-decoration: none;
  color: #fff;
  text-align: center;
  font-weight: bold;
}

/* メイン */
.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px 20px;
}

/* カード */
.box {
  background: rgba(255,255,255,0.9);
  border-radius: 12px;
  height: 400px;
  overflow: hidden;
  color: #333;
}

/* サイズ */
.left, .right {
  width: 250px;
}

.center {
  width: 500px;
  padding: 30px;
  text-align: center;
}

/* 画像 */
img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ✅ SNS（ここ改善ポイント） */
.sns-section {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px 20px;
}

/* ガラス風ボタン */
.sns-box {
  width: 180px;
  height: 110px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 15px;
  text-decoration: none;

  /* ここが重要 */
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);

  color: #fff;
  font-weight: bold;

  border: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);

  transition: 0.3s;
}

/* ホバー */
.sns-box:hover {
  transform: translateY(-8px);
}

/* Instagram */
.instagram {
  background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
  color: #fff;
}

/* TikTok（見やすく） */
.tiktok {
  color: #00f7ff;
  text-shadow: 0 0 8px #00f7ff;
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .left, .center, .right {
    width: 90%;
  }

  .sns-section {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">ポートフォリオ</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <div class="box left">
    <img src="image1.jpg">
  </div>

  <div class="box center">
    <h2>自己紹介</h2>
    <p>
      はじめまして。<br>
      Web制作を勉強中です。<br><br>
      シンプルで見やすいサイトを作るのが好きです。
    </p>
  </div>

  <div class="box right">
    <img src="image2.jpg">
  </div>

</div>

<!-- ✅ SNS -->
<div class="sns-section">

  <a href="https://instagram.com" target="_blank" class="sns-box instagram">
    📸 Instagram
  </a>

  <a href="https://www.tiktok.com/@matsutart?lang=ja-JP" target="_blank" class="sns-box tiktok">
    🎵 TikTok
  </a>

  <a href="https://x.com/matsuu_jp" target="_blank" class="sns-box">
    ✖ X
  </a>

</div>

</body>
</html>
