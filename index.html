

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* === ヘッダー（ズレ修正） === */
    header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: #fff;
      padding: 20px;
      border-bottom: 2px solid #ddd;
      text-align: center;
    }

    header div {
      display: inline-block;
      border: 2px solid #000;
      padding: 10px 20px;
      transition: 0.3s;
      cursor: pointer;
    }

    header div:hover {
      background: #000;
      color: #fff;
    }

    /* === メイン === */
    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px;
    }

    .box {
      background: #fff;
      border: 2px solid #000;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .left, .right {
      width: 250px;
    }

    .center {
      width: 500px;
      padding: 20px;
      text-align: center;
    }

    /* === 画像対応 === */
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* === アニメーション === */
    .box {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s forwards;
    }

    .left { animation-delay: 0.2s; }
    .center { animation-delay: 0.4s; }
    .right { animation-delay: 0.6s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* === スマホ対応 === */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .left, .center, .right {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <div>ポートフォリオ</div>
    <div>TOP</div>
    <div>BLOG</div>
  </header>

  <!-- メイン -->
  <div class="container">

    <!-- 左の写真 -->
    <div class="box left">
      <img src="image1.jpg" alt="写真">
    </div>

    <!-- 自己紹介 -->
    <div class="box center">
      <div>
        <h2>自己紹介</h2>
        <p>
          はじめまして。<br>
          Web制作を勉強中です。<br><br>
          シンプルで見やすいサイトを作るのが好きです。
        </p>
      </div>
    </div>

    <!-- 右の写真 -->
    <div class="box right">
      <img src="image2.jpg" alt="写真">
    </div>

  </div>

</body>
</html>
