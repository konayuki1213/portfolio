<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
}

/* ✅ メイン */
.main {
  display: flex;
  gap: 60px;
  max-width: 1400px;
  margin: 0 auto;

  padding: 40px 60px 60px;
  align-items: flex-start;
}

/* 左 */
.left {
  flex: 1;
}

/* タイトル */
.title {
  font-size: 42px;
  margin-bottom: 10px;
}

.subtitle {
  color: #888;
  margin-bottom: 30px;
}

/* ✅ スライダー */
.slider {
  position: relative;
  width: 100%;
  height: 450px;
  overflow: hidden;
  border-radius: 16px;
}

/* スライド */
.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;

  opacity: 0;
  transition: opacity 1s;
}

.slide.active {
  opacity: 1;
}

/* ✅ 右 */
.right {
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 25px;

  margin-top: 160px;   /* ←ここでバランス調整🔥 */
}

/* カード */
.card {
  display: flex;
  align-items: center;
  gap: 15px;

  padding: 20px;
  border-radius: 16px;

  text-decoration: none;
  color: #aaa;

  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);

  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  color: #fff;
}

/* アイコン */
.icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  overflow: hidden;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* テキスト */
.text {
  display: flex;
  flex-direction: column;
}

.text-title {
  font-size: 16px;
  color: #fff;
}

.text-desc {
  font-size: 14px;
}

/* ✅ スマホ */
@media (max-width: 768px) {

  .main {
    flex-direction: column;
    padding: 30px;
  }

  .right {
    width: 100%;
    margin-top: 0;
  }

  .title {
    font-size: 32px;
  }

  .slider {
    height: 300px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html" style="font-weight:700;">TOP</a>
  <a href="about.html">ABOUT</a>
</header>

<div class="main">

  <!-- 左 -->
  <div class="left">

    <h1 class="title">Welcome</h1>
    <p class="subtitle">まつたの写真館へ</p>

    <!-- ✅ スライド -->
    <div class="slider">
      <img src="image1.jpg" class="slide active">
      <img src="image2.jpg" class="slide">
      <img src="image3.jpg" class="slide">
    </div>

  </div>

  <!-- 右 -->
  <div class="right">

    <a href="https://x.com/matsuu_jp" class="card">
      <div class="icon"><img src="x.jpg"></div>
      <div class="text">
        <div class="text-title">X (Twitter)</div>
        <div class="text-desc">@matsuu_jp の投稿</div>
      </div>
    </a>

    <a href="https://instagram.com" class="card">
      <div class="icon"><img src="insta.jpg"></div>
      <div class="text">
        <div class="text-title">Instagram</div>
        <div class="text-desc">写真を見る</div>
      </div>
    </a>

    <a href="https://www.tiktok.com/@matsutart" class="card">
      <div class="icon"><img src="tiktok.jpg"></div>
      <div class="text">
        <div class="text-title">TikTok</div>
        <div class="text-desc">動画を見る</div>
      </div>
    </a>

    <a href="https://note.com/matsuta_jp" class="card">
      <div class="icon"><img src="note.jpg"></div>
      <div class="text">
        <div class="text-title">NOTE</div>
        <div class="text-desc">記事を読む</div>
      </div>
    </a>

  </div>

</div>

<!-- ✅ スライドJS -->
<script>
const slides = document.querySelectorAll(".slide");
let index = 0;

setInterval(() => {
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
}, 3000);
</script>

</body>
</html>
