<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
  transition: 0.3s;
}

header a:hover {
  opacity: 0.6;
  transform: translateY(-2px);
}

header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* ✅ メイン */
.main {
  display: flex;
  gap: 60px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 70px;
  align-items: center;
}

/* ✅ 左（スライド） */
.left {
  flex: 1;
  position: relative;
  height: 520px;
  overflow: hidden;
}

.slide {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;
  object-fit: cover;

  border-radius: 16px;

  opacity: 0;
  transform: scale(1.05);
  transition: opacity 1s ease, transform 3s ease;
}

/* 表示中 */
.slide.active {
  opacity: 1;
  transform: scale(1);
  z-index: 1;
}

/* ✅ 右 */
.right {
  width: 420px;
  display: flex;
  flex-direction: column;
  gap: 35px;
}

/* ✅ Twitter */
.twitter {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 10px;
}

/* ✅ NOTE */
.note {
  background: rgba(255,255,255,0.08);
  padding: 30px;
  border-radius: 16px;
  transition: 0.3s;
}

.note:hover {
  transform: translateY(-5px);
}

.note h3 {
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.note p {
  color: #bbb;
  font-size: 14px;
}

/* スマホ */
@media (max-width: 768px) {
  .main {
    flex-direction: column;
    padding: 40px;
  }

  .right {
    width: 100%;
  }

  .left {
    height: 300px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html" style="font-weight:700;">TOP</a>
  <a href="about.html">ABOUT</a>
</header>

<div class="main">

  <!-- ✅ 左 -->
  <div class="left">
    <img src="image1.jpg" class="slide active">
    <img src="image2.jpg" class="slide">
    <img src="image3.jpg" class="slide">
  </div>

  <!-- ✅ 右 -->
  <div class="right">

    <!-- Twitter -->
    <div class="twitter">
      <a class="twitter-timeline"
         data-height="280"
         data-theme="dark"
         href="https://x.com/matsuu_jp">
      </a>
    </div>

    <!-- NOTE -->
    <div class="note">
      <h3>NOTE</h3>
      <p>
        最近の記事をここに表示します。<br>
        Coming soon...
      </p>
    </div>

  </div>

</div>

<!-- ✅ スライド -->
<script>
const slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");

  current = (current + 1) % slides.length;

  slides[current].classList.add("active");
}, 3000);
</script>

<!-- ✅ Twitter（絶対これ！） -->
<script async src="https://platform.twitter.com/widgets.js"></script>

</body>
</html>
