

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #f4f4f4;
  color: #333;
}

/* ヘッダー */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  background: #fff;
  padding: 20px;
  border-bottom: 1px solid #ddd;
}

header a {
  text-decoration: none;
  color: #000;
  font-weight: bold;
  text-align: center;
  transition: 0.3s;
}

header a:hover {
  opacity: 0.5;
}

/* メイン */
.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px 20px;
}

.box {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  height: 400px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.left, .right {
  width: 250px;
}

.center {
  width: 500px;
  padding: 30px;
  text-align: center;
}

/* 画像 */
img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.5s;
}

img:hover {
  transform: scale(1.05);
}

/* アニメーション */
.box {
  opacity: 0;
  transform: translateY(30px);
  animation: fade 1s forwards;
}

.left { animation-delay: 0.2s; }
.center { animation-delay: 0.4s; }
.right { animation-delay: 0.6s; }

@keyframes fade {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .left, .center, .right {
    width: 90%;
  }
}

</style>
</head>

<body>

<header>
  <a href="portfolio.html">ポートフォリオ</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <div class="box left">
    <img src="image1.jpg">
  </div>

  <div class="box center">
    <h2>自己紹介</h2>
    <p>
      はじめまして。<br>
      Web制作を勉強中です。<br><br>
      シンプルで見やすいサイトを作るのが好きです。
    </p>
  </div>

  <div class="box right">
    <img src="image2.jpg">
  </div>

</div>

</body>
</html>
