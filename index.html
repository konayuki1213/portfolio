<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
  transition: 0.3s;
}

header a:hover {
  opacity: 0.6;
  transform: translateY(-2px);
}

header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* メイン */
.main {
  display: flex;
  gap: 60px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 70px;
  align-items: center;
}

/* 左スライド */
.left {
  flex: 1;
  position: relative;
  height: 520px;
  overflow: hidden;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
  opacity: 0;
  transform: scale(1.05);
  transition: opacity 1s, transform 3s;
}

.slide.active {
  opacity: 1;
  transform: scale(1);
}

/* 右 */
.right {
  width: 420px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 共通カード */
.card {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  transition: 0.3s;
  padding: 20px;
}

.card:hover {
  transform: translateY(-6px);
}

/* SNSカード */
.sns-card {
  display: flex;
  align-items: center;
  gap: 15px;
  text-decoration: none;
  color: #aaa;
}

/* 丸アイコン */
.sns-icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  overflow: hidden;
}

.sns-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* テキスト */
.sns-text {
  display: flex;
  flex-direction: column;
}

.sns-title {
  color: #fff;
  font-size: 16px;
  margin-bottom: 4px;
}

.sns-desc {
  font-size: 14px;
}

/* ホバー */
.sns-card:hover {
  color: #fff;
}

/* スマホ */
@media (max-width: 768px) {
  .main {
    flex-direction: column;
    padding: 40px;
  }

  .right {
    width: 100%;
  }

  .left {
    height: 300px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html" style="font-weight:700;">TOP</a>
  <a href="about.html">ABOUT</a>
</header>

<div class="main">

  <!-- ✅ 左：スライド -->
  <div class="left">
    <img src="image1.jpg" class="slide active">
    <img src="image2.jpg" class="slide">
    <img src="image3.jpg" class="slide">
  </div>

  <!-- ✅ 右 -->
  <div class="right">

    <!-- X -->
    <div class="card">
      <a href="https://x.com/matsuu_jp" target="_blank" class="sns-card">
        <div class="sns-icon">
          <img src="image12.jpg">
        </div>
        <div class="sns-text">
          <div class="sns-title">X (Twitter)</div>
          <div class="sns-desc">@matsuu_jp の投稿を見る</div>
        </div>
      </a>
    </div>

    <!-- Instagram -->
    <div class="card">
      <a href="https://instagram.com" target="_blank" class="sns-card">
        <div class="sns-icon">
          <img src="image12.jpg">
        </div>
        <div class="sns-text">
          <div class="sns-title">Instagram</div>
          <div class="sns-desc">写真を見る</div>
        </div>
      </a>
    </div>

    <!-- TikTok -->
    <div class="card">
      <a href="https://www.tiktok.com/@matsutart" target="_blank" class="sns-card">
        <div class="sns-icon">
          <img src="image12.jpg">
        </div>
        <div class="sns-text">
          <div class="sns-title">TikTok</div>
          <div class="sns-desc">動画を見る</div>
        </div>
      </a>
    </div>

    <!-- NOTE -->
    <div class="card">
      <a href="https://note.com/matsuta_jp" target="_blank" class="sns-card">
        <div class="sns-icon">
          <img src="image12.jpg">
        </div>
        <div class="sns-text">
          <div class="sns-title">NOTE</div>
          <div class="sns-desc">記事を読む</div>
        </div>
      </a>
    </div>

  </div>

</div>

<!-- スライド -->
<script>
const slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 3000);
</script>

</body>
</html>
