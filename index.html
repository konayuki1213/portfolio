<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<!-- ✅ フォント（これが正解🔥） -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ✅ ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #aaa;
  text-decoration: none;
  letter-spacing: 3px;
  transition: 0.3s;
}

header a:hover {
  color: #fff;
  transform: translateY(-2px);
}

header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

header a.active {
  color: #fff;
  font-weight: 700;
}

/* ✅ メイン */
.main {
  display: flex;
  gap: 60px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 60px 60px;
}

.left {
  flex: 1;
}

.title {
  font-size: 42px;
  font-weight: 600;
}

.subtitle {
  color: #888;
  margin-bottom: 30px;
}

/* ✅ スライダー */
.slider {
  position: relative;
  width: 100%;
  height: 450px;
  overflow: hidden;
  border-radius: 16px;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: 1s;
}

.slide.active {
  opacity: 1;
}

/* ✅ 右 */
.right {
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 25px;
  margin-top: 170px;
}

/* ✅ カード */
.card {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 20px;
  border-radius: 16px;
  text-decoration: none;
  color: #aaa;

  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  color: #fff;
}

/* アイコン */
.icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  overflow: hidden;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ✅ ✅ スマホ修正（ガチ重要🔥） */
@media (max-width: 768px) {

  .main {
    flex-direction: column;
    padding: 30px;
  }

  .left {
    text-align: center;
  }

  /* ✅ スライダー改善 */
  .slider {
    width: 100%;
    max-width: 350px;
    aspect-ratio: 3/4;
    height: auto;
    margin: 0 auto;
  }

  .slide {
    object-fit: cover; /* ←これで自然に見える */
  }

  .right {
    width: 100%;
    margin-top: 30px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html" class="active">TOP</a>
  <a href="about.html">ABOUT</a>
</header>

<div class="main">

  <div class="left">
    <h1 class="title">Welcome</h1>
    <p class="subtitle">まつたの写真館へ</p>

    <div class="slider">
      <img src="image1.jpg" class="slide active">
      <img src="image2.jpg" class="slide">
      <img src="image3.jpg" class="slide">
    </div>
  </div>

  <div class="right">

    <a href="https://x.com/matsuu_jp" class="card">
      <div class="icon"><img src="x.jpg"></div>
      <div>X (Twitter)</div>
    </a>

    <a href="https://instagram.com" class="card">
      <div class="icon"><img src="insta.jpg"></div>
      <div>Instagram</div>
    </a>

    <a href="https://www.tiktok.com/@matsutart" class="card">
      <div class="icon"><img src="tiktok.jpg"></div>
      <div>TikTok</div>
    </a>

    <a href="https://note.com/matsuta_jp" class="card">
      <div class="icon"><img src="note.jpg"></div>
      <div>NOTE</div>
    </a>

  </div>

</div>

<script>
const slides = document.querySelectorAll(".slide");
let index = 0;

setInterval(() => {
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
}, 3000);
</script>

</body>
</html>
