
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #fafafa;
}

/* ヘッダー */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 20px;
  border-bottom: 1px solid #ddd;
}

header a {
  text-align: center;
  text-decoration: none;
  color: #000;
  font-weight: bold;
}

/* レイアウト */
.container {
  display: flex;
}

/* 左メニュー */
.sidebar {
  width: 200px;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: none;
  background: #eee;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar button:hover {
  background: #000;
  color: #fff;
}

/* ギャラリー */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}

.item {
  height: 180px;
  overflow: hidden;
  border-radius: 10px;
  background: #ccc;
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.item img:hover {
  transform: scale(1.1);
}

/* 非表示 */
.hidden {
  display: none;
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">ポートフォリオ</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <!-- 左メニュー -->
  <div class="sidebar">
    <button onclick="filter('all')">すべて</button>
    <button onclick="filter('portrait')">ポートレート</button>
    <button onclick="filter('landscape')">風景</button>
    <button onclick="filter('nature')">自然</button>
    <button onclick="filter('still')">静物</button>
    <button onclick="filter('snap')">スナップ</button>
    <button onclick="filter('art')">アート</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">

    <!-- 画像 -->
    <div class="item portrait">image1.jpg</div>
    <div class="item landscape">image2.jpg</div>
    <div class="item nature">image1.jpg</div>
    <div class="item still">image2.jpg</div>
    <div class="item snap">image1.jpg</div>
    <div class="item art">image2.jpg</div>

    <!-- 増やしてOK -->
    <div class="item nature">image1.jpg</div>
    <div class="item portrait">image2.jpg</div>
    <div class="item landscape">image1.jpg</div>

  </div>

</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      if (item.classList.contains(category)) {
        item.classList.remove("hidden");
      } else {
        item.classList.add("hidden");
      }
    }
  });
}
</script>

</body>
</html>
``
