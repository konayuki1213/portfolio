<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #aaa;
  text-decoration: none;
  letter-spacing: 3px;
  transition: 0.3s;
}

header a:hover {
  color: #fff;
  transform: translateY(-2px);
}

header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* 選択中 */
header a.active {
  color: #fff;
  font-weight: 700;
}

/* 全体 */
.container {
  display: flex;
  max-width: 1500px;
  margin: 0 auto;
}

/* サイドバー */
.sidebar {
  width: 180px;
  padding: 30px 20px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 20px;
  padding: 12px;
  background: none;
  border: none;
  color: #aaa;
  text-align: left;
  cursor: pointer;
  font-size: 22px;
  letter-spacing: 2px;
  transition: 0.3s;
}

.sidebar button:hover {
  color: #fff;
  transform: translateX(6px);
}

/* ギャラリー */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 30px;
  min-height: 70vh;
}

/* ✅ カード（ホバー復活🔥） */
.item {
  aspect-ratio: 16/9;
  overflow: hidden;
  border-radius: 14px;
  cursor: pointer;

  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  transition: 0.3s;
}

.item:hover {
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 30px 60px rgba(0,0,0,0.8);
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.5s;
}

.item:hover img {
  transform: scale(1.08);
}

/* 非表示 */
.hidden {
  display: none;
}

/* ✅ モーダル（拡大） */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;

  transform: scale(0.9);
  transition: 0.3s;
}

.modal.active {
  display: flex;
}

.modal.active img {
  transform: scale(1);
}

/* スマホ */
@media (max-width: 768px) {

  .container {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px;
  }

  .sidebar button {
    width: auto;
    font-size: 16px;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html" class="active">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="about.html">ABOUT</a>
</header>

<div class="container">

  <!-- カテゴリ -->
  <div class="sidebar">
    <button onclick="filter('all')">ALL</button>
    <button onclick="filter('nature')">NATURE</button>
    <button onclick="filter('snap')">SNAP</button>
    <button onclick="filter('art')">ART</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">
    <div class="item nature"><img src="image1.jpg"></div>
    <div class="item snap"><img src="image2.jpg"></div>
    <div class="item nature"><img src="image3.jpg"></div>

    <div class="item nature"><img src="image4.jpg"></div>
    <div class="item art"><img src="image5.jpg"></div>
    <div class="item snap"><img src="image6.jpg"></div>

    <div class="item nature"><img src="image7.jpg"></div>
    <div class="item nature"><img src="image8.jpg"></div>
    <div class="item nature"><img src="image9.jpg"></div>

    <div class="item nature"><img src="image10.jpg"></div>
    <div class="item snap"><img src="image11.jpg"></div>

    <div class="item nature"><img src="image12.jpg"></div>
    <div class="item nature"><img src="image13.jpg"></div>
    <div class="item snap"><img src="image14.jpg"></div>

    <div class="item snap"><img src="image15.jpg"></div>
    <div class="item snap"><img src="image16.jpg"></div>
    <div class="item snap"><img src="image17.jpg"></div>

    <div class="item snap"><img src="image18.jpg"></div>
    <div class="item snap"><img src="image19.jpg"></div>
    <div class="item nature"><img src="image20.jpg"></div>

    <div class="item snap"><img src="image21.jpg"></div>
    <div class="item nature"><img src="image22.jpg"></div>
    <div class="item snap"><img src="image23.jpg"></div>
    <div class="item nature"><img src="image24.jpg"></div>

    <div class="item snap"><img src="image25.jpg"></div>
    <div class="item nature"><img src="image26.jpg"></div>
    <div class="item nature"><img src="image27.jpg"></div>

    <div class="item nature"><img src="image28.jpg"></div>
    <div class="item nature"><img src="image29.jpg"></div>
  </div>

</div>

<!-- ✅ 拡大 -->
<div class="modal" id="modal">
  <img id="modalImg">
</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      item.classList.toggle("hidden", !item.classList.contains(category));
    }
  });
}

/* 拡大 */
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const images = document.querySelectorAll(".item img");

images.forEach(img => {
  img.addEventListener("click", () => {
    modal.classList.add("active");
    modalImg.src = img.src;
  });
});

/* 閉じる */
modal.addEventListener("click", () => {
  modal.classList.remove("active");
});
</script>

</body>
</html>
