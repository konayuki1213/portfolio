<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
}

/* レイアウト */
.container {
  display: flex;
}

/* サイドバー */
.sidebar {
  width: 200px;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  background: none;
  border: none;
  color: #888;
  text-align: left;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar button:hover {
  color: #fff;
}

/* ギャラリー */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 30px;
}

/* ✅ ふわっと表示 */
.item {
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 10px;
  cursor: pointer;

  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.8s forwards;
}

.item:nth-child(1) { animation-delay: 0.1s; }
.item:nth-child(2) { animation-delay: 0.2s; }
.item:nth-child(3) { animation-delay: 0.3s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.item img:hover {
  transform: scale(1.08);
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

/* ✅ 作品表示 */
.modal-content {
  text-align: center;
  max-width: 700px;
}

.modal-content img {
  width: 100%;
  border-radius: 10px;
}

.modal-content h3 {
  margin-top: 15px;
}

.modal-content p {
  color: #aaa;
  font-size: 14px;
}

/* 非表示 */
.hidden {
  display: none;
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <!-- カテゴリ -->
  <div class="sidebar">
    <button onclick="filter('all')">ALL</button>
    <button onclick="filter('nature')">NATURE</button>
    <button onclick="filter('snap')">SNAP</button>
    <button onclick="filter('art')">ART</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">

    <div class="item nature" onclick="openModal('image1.jpg','昭和記念公園','秋に撮影した作品。きれいな紅葉。')">
      <img src="image1.jpg">
    </div>

    <div class="item snap" onclick="openModal('image2.jpg','昭和記念公園','青と紅葉が広がる幻想的な風景。')">
      <img src="image2.jpg">
    </div>

<div class="item nature" onclick="openModal('image3.jpg','昭和記念公園','秋に撮影した作品。')">
  <img src="image3.jpg">
</div>

<div class="item nature" onclick="openModal('image4.jpg','昭和記念公園','秋に撮影した作品。')">
  <img src="image4.jpg">
</div>

<div class="item art" onclick="openModal('image5.jpg','彫刻の森美術館','冬に撮影した作品。')">
  <img src="image5.jpg">
</div>

<div class="item snap" onclick="openModal('image6.jpg','箱根神社','冬に撮影した作品。')">
  <img src="image6.jpg">
</div>

<div class="item nature" onclick="openModal('image7.jpg','ソレイユの丘 ネモフィラ','春に撮影した作品。')">
  <img src="image7.jpg">
</div>

<div class="item nature" onclick="openModal('image8.jpg','ソレイユの丘 羊たち','春に撮影した作品。')">
  <img src="image8.jpg">
</div>

<div class="item nature" onclick="openModal('image9.jpg','花菜ガーデン','夏に撮影した作品。')">
  <img src="image9.jpg">
</div>

<div class="item nature" onclick="openModal('image10.jpg','花菜ガーデン','夏に撮影した作品。')">
  <img src="image10.jpg">
</div>

<div class="item snap" onclick="openModal('image11.jpg','奈良井宿','夏に撮影した作品。')">
  <img src="image11.jpg">
</div>

  </div>

</div>

<!-- ✅ モーダル -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content">
    <img id="modalImg">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
  </div>
</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      if (item.classList.contains(category)) {
        item.classList.remove("hidden");
      } else {
        item.classList.add("hidden");
      }
    }
  });
}

/* ✅ クリックで詳細表示 */
function openModal(src, title, desc) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalDesc").textContent = desc;
}

/* 閉じる */
function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

.item {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(6px);
  padding: 5px;
}


.item:hover {
  transform: translateY(-5px);
}



</body>
</html>
