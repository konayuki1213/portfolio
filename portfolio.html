<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #f5f5f5;
}

/* ヘッダー */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 20px;
  border-bottom: 1px solid #ddd;
  background: #fff;
}

header a {
  text-align: center;
  text-decoration: none;
  color: #000;
  font-weight: bold;
}

/* レイアウト */
.container {
  display: flex;
}

/* サイドバー */
.sidebar {
  width: 200px;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: none;
  background: #eee;
  cursor: pointer;
}

.sidebar button:hover {
  background: #000;
  color: #fff;
}

/* ギャラリー */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 30px;
}

/* 写真 */
.item {
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 12px;
  cursor: pointer;
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.item img:hover {
  transform: scale(1.08);
}

/* 非表示 */
.hidden {
  display: none;
}

/* ✅ モーダル */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  max-width: 600px;
  text-align: center;
}

.modal-content img {
  width: 100%;
  border-radius: 10px;
}

.modal-content h3 {
  margin: 10px 0 5px;
}

.modal-content p {
  color: #555;
  font-size: 14px;
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">ポートフォリオ</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <!-- カテゴリー -->
  <div class="sidebar">
    <button onclick="filter('all')">すべて</button>
    <button onclick="filter('portrait')">ポートレート</button>
    <button onclick="filter('landscape')">風景</button>
    <button onclick="filter('nature')">自然</button>
    <button onclick="filter('still')">静物</button>
    <button onclick="filter('snap')">スナップ</button>
    <button onclick="filter('art')">アート</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">

    <div class="item portrait" onclick="openModal('image1.jpg','ルピナス','春の花を綺麗に撮影した一枚')">
      <img src="image1.jpg">
    </div>

    <div class="item landscape" onclick="openModal('image2.jpg','ネモフィラ','青い花畑が広がる美しい景色')">
      <img src="image2.jpg">
    </div>

    <div class="item nature" onclick="openModal('image1.jpg','自然','色のバランスを意識した作品')">
      <img src="image1.jpg">
    </div>

    <div class="item still" onclick="openModal('image2.jpg','静物','落ち着いた雰囲気を表現')">
      <img src="image2.jpg">
    </div>

    <div class="item snap" onclick="openModal('image1.jpg','スナップ','日常の一瞬を切り取る')">
      <img src="image1.jpg">
    </div>

    <div class="item art" onclick="openModal('image2.jpg','アート','構図を意識した表現作品')">
      <img src="image2.jpg">
    </div>

  </div>

</div>

<!-- モーダル -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content">
    <img id="modalImg">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
  </div>
</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      if (item.classList.contains(category)) {
        item.classList.remove("hidden");
      } else {
        item.classList.add("hidden");
      }
    }
  });
}

function openModal(src, title, desc) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalDesc").textContent = desc;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
