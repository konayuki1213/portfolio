<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  letter-spacing: 3px;
}

/* レイアウト */
.container {
  display: flex;
}

/* サイドバー */
.sidebar {
  width: 200px;
  padding: 20px;
}

.sidebar button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  background: none;
  border: none;
  color: #aaa;
  text-align: left;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar button:hover {
  color: #fff;
}

/* ギャラリー */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 30px;
}

.item {
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 10px;
  cursor: pointer;
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.item img:hover {
  transform: scale(1.08);
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
}

/* 非表示 */
.hidden {
  display: none;
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <!-- カテゴリ -->
  <div class="sidebar">
    <button onclick="filter('all')">ALL</button>
    <button onclick="filter('nature')">NATURE</button>
    <button onclick="filter('snap')">SNAP</button>
    <button onclick="filter('art')">ART</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">

    <div class="item nature" onclick="openModal('image1.jpg')">
      <img src="image1.jpg">
    </div>

    <div class="item snap" onclick="openModal('image2.jpg')">
      <img src="image2.jpg">
    </div>

    <div class="item art" onclick="openModal('image1.jpg')">
      <img src="image1.jpg">
    </div>

  </div>

</div>

<!-- モーダル -->
<div class="modal" id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      if (item.classList.contains(category)) {
        item.classList.remove("hidden");
      } else {
        item.classList.add("hidden");
      }
    }
  });
}

function openModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
