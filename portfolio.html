<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #fafafa;
}

/* ヘッダー */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 20px;
  border-bottom: 1px solid #ddd;
}

header a {
  text-align: center;
  text-decoration: none;
  color: #000;
  font-weight: bold;
}

/* レイアウト */
.container {
  display: flex;
}

/* 左メニュー */
.sidebar {
  width: 200px;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: none;
  background: #eee;
  cursor: pointer;
}

.sidebar button:hover {
  background: #000;
  color: #fff;
}

/* ✅ 写真グリッド（サイズ大きくした） */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 30px;
}

.item {
  height: 250px; /* ←ここで大きくしてる */
  overflow: hidden;
  border-radius: 10px;
  cursor: pointer;
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.item img:hover {
  transform: scale(1.08);
}

/* 非表示 */
.hidden {
  display: none;
}

/* ✅ モーダル（拡大表示） */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
}

/* スマホ */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">ポートフォリオ</a>
  <a href="index.html">TOP</a>
  <a href="blog.html">BLOG</a>
</header>

<div class="container">

  <!-- 左メニュー -->
  <div class="sidebar">
    <button onclick="filter('all')">すべて</button>
    <button onclick="filter('portrait')">ポートレート</button>
    <button onclick="filter('landscape')">風景</button>
    <button onclick="filter('nature')">自然</button>
    <button onclick="filter('still')">静物</button>
    <button onclick="filter('snap')">スナップ</button>
    <button onclick="filter('art')">アート</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">

    <div class="item portrait">
      <img src="image1.jpg" onclick="openModal(this.src)">
    </div>

    <div class="item landscape">
      <img src="image2.jpg" onclick="openModal(this.src)">
    </div>

    <div class="item nature">
      <img src="image1.jpg" onclick="openModal(this.src)">
    </div>

    <div class="item still">
      <img src="image2.jpg" onclick="openModal(this.src)">
    </div>

    <div class="item snap">
      <img src="image1.jpg" onclick="openModal(this.src)">
    </div>

    <div class="item art">
      <img src="image2.jpg" onclick="openModal(this.src)">
    </div>

  </div>

</div>

<!-- ✅ 拡大表示 -->
<div class="modal" id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      if (item.classList.contains(category)) {
        item.classList.remove("hidden");
      } else {
        item.classList.add("hidden");
      }
    }
  });
}

/* ✅ クリックで拡大 */
function openModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

/* ✅ 閉じる */
function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
