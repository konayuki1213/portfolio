<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
  transition: 0.3s;
}

header a:hover {
  opacity: 0.6;
  transform: translateY(-2px);
}

header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* ✅ 全体（ここが重要） */
.container {
  display: flex;
  max-width: 1500px;   /* ← 小ささ解決 */
  margin: 0 auto;      /* ← 中央揃え */
}

/* サイドバー */
.sidebar {
  width: 160px;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 12px;
  padding: 8px;
  background: none;
  border: none;
  color: #888;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
  transition: 0.3s;
}

.sidebar button:hover {
  color: #fff;
}

/* ✅ ギャラリー */
.gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;   /* ← 高級感 */
  padding: 30px;
}

/* カード */
.item {
  aspect-ratio: 16/9;
  overflow: hidden;
  border-radius: 14px;

  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  transition: 0.3s;
}

.item:hover {
  transform: translateY(-8px) scale(1.03);
}

/* 画像 */
.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.5s;
}

.item:hover img {
  transform: scale(1.08);
}

/* フィルター用 */
.hidden {
  display: none;
}

/* ✅ スマホ */
@media (max-width: 768px) {

  .container {
    flex-direction: column;
  }

  /* 横並び（改善済み） */
  .sidebar {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px 10px;
  }


.sidebar button {
  width: 100%;
  margin-bottom: 12px;
  padding: 10px;
  background: none;
  border: none;
  color: #888;
  text-align: left;
  cursor: pointer;

  font-size: 17px;     /* 🔥 大きくする */
  letter-spacing: 1px; /* ちょいおしゃれ */
  transition: 0.3s;
}


  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
  }

}
</style>
</head>

<body>

<header>
  <a href="portfolio.html" style="font-weight:700;">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="about.html">ABOUT</a>
</header>

<div class="container">

  <!-- カテゴリ -->
  <div class="sidebar">
    <button onclick="filter('all')">ALL</button>
    <button onclick="filter('nature')">NATURE</button>
    <button onclick="filter('snap')">SNAP</button>
    <button onclick="filter('art')">ART</button>
  </div>

  <!-- ギャラリー -->
  <div class="gallery">

    <div class="item nature"><img src="image1.jpg"></div>
    <div class="item snap"><img src="image2.jpg"></div>
    <div class="item nature"><img src="image3.jpg"></div>

    <div class="item nature"><img src="image4.jpg"></div>
    <div class="item art"><img src="image5.jpg"></div>
    <div class="item snap"><img src="image6.jpg"></div>

    <div class="item nature"><img src="image7.jpg"></div>
    <div class="item nature"><img src="image8.jpg"></div>
    <div class="item nature"><img src="image9.jpg"></div>

    <div class="item nature"><img src="image10.jpg"></div>
    <div class="item snap"><img src="image11.jpg"></div>

  </div>

</div>

<script>
function filter(category) {
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    if (category === "all") {
      item.classList.remove("hidden");
    } else {
      item.classList.toggle("hidden", !item.classList.contains(category));
    }
  });
}
</script>

</body>
</html>
