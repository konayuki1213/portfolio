<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
  letter-spacing: 3px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  transition: 0.3s;
}

header a:hover {
  opacity: 0.6;
  transform: translateY(-2px);
}

/* 下線 */
header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* ✅ メインレイアウト（仕上げ） */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 120px;
  padding: 120px;

  /* 中央寄せ感アップ */
  transform: translateY(-20px);
}

/* ✅ 写真 */
.photo {
  width: 420px;
  height: 520px;
  border-radius: 12px;
  overflow: hidden;

  /* 🔥 影追加（超重要） */
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ✅ テキスト */
.text {
  max-width: 460px;
}

h1 {
  margin-bottom: 40px;
  font-size: 32px;
  letter-spacing: 2px;
}

p {
  line-height: 2;
  color: #bbb;
  font-size: 16px;
}

/* ✅ SNS */
.sns {
  margin-top: 40px;
  display: flex;
  gap: 25px;
}

/* アイコン */
.icon {
  color: #999; /* 少し明るく */
  transition: 0.3s;
}

.icon svg {
  width: 28px;
}

.icon:hover {
  color: #fff;
  transform: translateY(-4px);
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="about.html" style="font-weight:700;">ABOUT</a>
</header>

<div class="container">

  <!-- 写真 -->
  <div class="photo">
    <img src="image11.jpg">
  </div>

  <!-- テキスト -->
  <div class="text">

    <h1>ABOUT</h1>

    <p>

      このサイトでは、
      これまでに撮影した作品をまとめています。
    </p>

    <!-- SNS -->
    <div class="sns">

      <!-- X -->
      <a href="https://x.com/matsuu_jp" target="_blank" class="icon">

          d="M18.244 2H21.5L14.75 10.05L22.5 22H16.5L11.7 14.8L5.5 22H2.25L9.4 13.5L2 2H8.2L12.6 8.6L18.244 2Z"/>
        </svg>
      </a>

      <!-- Instagram -->

</html>
