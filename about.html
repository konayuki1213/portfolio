<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>

<!-- ✅ フォント（正しい！） -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  letter-spacing: 3px;
  position: relative;
}

/* 下線 */
header a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 0;
  height: 2px;
  background: #fff;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* メイン */
.main {
  max-width: 700px;
  margin: 0 auto;
  padding: 100px 30px;
  text-align: center;
}

/* ✅ 丸プロフィール */
.profile-icon {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 30px;

  border: 2px solid rgba(255,255,255,0.15);
}

.profile-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* タイトル */
.title {
  font-size: 42px;
  font-weight: 600;
  margin-bottom: 40px;
}

/* テキスト */
.text {
  font-size: 16px;
  line-height: 2;
  color: #aaa;
}

.text p {
  margin-bottom: 25px;
}

/* ✅ SNS（今回の主役🔥） */
.sns {
  margin-top: 50px;
  display: flex;
  justify-content: center;
  gap: 35px;
}

/* アイコン枠なし */
.sns a {
  width: 32px;
  height: 32px;
  display: block;

  opacity: 0.6;
  transition: 0.3s;
}

/* ホバー */
.sns a:hover {
  opacity: 1;
  transform: translateY(-3px);
}

/* ロゴ */
.sns img {
  width: 100%;
  height: 100%;
  object-fit: contain;

  /* ✅ これが重要（白黒化） */
  filter: grayscale(1) brightness(1.2);
}

/* スマホ */
@media (max-width: 768px) {

  .main {
    padding: 60px 20px;
  }

  .title {
    font-size: 30px;
  }

  .profile-icon {
    width: 80px;
    height: 80px;
  }

}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="about.html" style="font-weight:700;">ABOUT</a>
</header>

<div class="main">

  <!-- ✅ プロフ -->
  <div class="profile-icon">
    <img src="profile.jpg">
  </div>

  <h1 class="title">ABOUT</h1>

  <div class="text">
    <p>ご覧いただきありがとうございます。</p>
    <p>日々、写真の撮影と編集を行っています。</p>
    <p>このサイトでは、これまでに撮影した作品をまとめています。</p>
  </div>

  <!-- ✅ SNS -->
  <div class="sns">
    <a href="https://x.com/matsuu_jp">
      <img src="x.png">
    </a>

    <a href="https://instagram.com">
      <img src="insta.png">
    </a>

    <a href="https://www.tiktok.com/@matsutart">
      <img src="tiktok.png">
    </a>
  </div>

</div>

</body>
</html>
