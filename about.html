<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>

<!-- ✅ フォント（ちゃんと書く） -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', "Helvetica Neue", sans-serif;
  background: #111;
  color: #fff;
}

/* ✅ ナビ（最終完成版🔥） */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
}

header a {
  text-align: center;
  color: #aaa;              /* ← 通常グレー */
  text-decoration: none;
  letter-spacing: 3px;
  position: relative;
  transition: 0.3s;
}

/* ✅ ホバー */
header a:hover {
  color: #fff;
  transform: translateY(-2px);
}

/* ✅ 下線（ホバーの時だけ） */
header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* ✅ 選択中（ABOUT） */
header a.active {
  color: #fff;
  font-weight: 700;
}

/* ❌ activeに線は絶対つけない */

/* メイン */
.main {
  max-width: 700px;
  margin: 0 auto;
  padding: 100px 30px;
  text-align: center;
}

/* プロフ */
.profile-icon {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 30px;
  border: 2px solid rgba(255,255,255,0.15);
}

.profile-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* タイトル */
.title {
  font-size: 42px;
  font-weight: 600;
  margin-bottom: 40px;
}

/* テキスト */
.text {
  font-size: 16px;
  line-height: 2;
  color: #aaa;
}

.text p {
  margin-bottom: 25px;
}

/* SNS */
.sns {
  margin-top: 50px;
  display: flex;
  justify-content: center;
  gap: 35px;
}

.sns a {
  width: 28px;
  height: 28px;
  opacity: 0.6;
  transition: 0.3s;
}

.sns a:hover {
  opacity: 1;
  transform: translateY(-3px);
}

.sns img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* スマホ */
@media (max-width: 768px) {
  .main {
    padding: 60px 20px;
  }

  .title {
    font-size: 30px;
  }

  .profile-icon {
    width: 80px;
    height: 80px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="about.html" class="active">ABOUT</a>
</header>

<div class="main">

  <div class="profile-icon">
    <img src="image12.jpg">
  </div>

  <h1 class="title">ABOUT</h1>

  <div class="text">
    <p>ご覧いただきありがとうございます。</p>
    <p>日々、写真の撮影と編集を行っています。</p>
    <p>このサイトでは、これまでに撮影した作品をまとめています。</p>
  </div>

  <div class="sns">
    <a href="https://x.com/matsuu_jp">
      <img src="https://cdn.simpleicons.org/x/ffffff">
    </a>

    <a href="https://instagram.com">
      <img src="https://cdn.simpleicons.org/instagram/ffffff">
    </a>

    <a href="https://www.tiktok.com/@matsutart">
      <img src="https://cdn.simpleicons.org/tiktok/ffffff">
    </a>
  </div>

</div>

</body>
</html>
