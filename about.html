  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: #111;

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
  letter-spacing: 3px;
}

header a {
  text-align: center;
  color: #fff;
  text-decoration: none;
  transition: 0.3s;
}

/* ホバー */
header a:hover {
  opacity: 0.6;
  transform: translateY(-2px);
}

/* 下線アニメ */
header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* メイン */
.main {
  max-width: 700px;
  margin: 120px auto;
  padding: 20px;
}

/* タイトル */
h1 {
  font-size: 28px;
  margin-bottom: 40px;
  letter-spacing: 2px;
}

/* テキスト */
p {
  line-height: 2;
  color: #bbb;
  font-size: 15px;
}
