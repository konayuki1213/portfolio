<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  color: #fff;

  background-image: url("bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* 背景暗く */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}

/* ナビ */
header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 30px;
  letter-spacing: 4px;
}

header a {
  text-align: center;
  font-size: 20px;
  color: #fff;
  text-decoration: none;
  transition: 0.3s;
}

/* ホバー */
header a:hover {
  opacity: 0.6;
  transform: translateY(-2px);
}

/* 下線アニメ */
header a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: #fff;
  margin-top: 5px;
  transition: 0.3s;
}

header a:hover::after {
  width: 100%;
}

/* メイン */
.main {
  height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* カード */
.card {
  max-width: 600px;
  padding: 50px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 25px;
  text-align: center;
}

/* タイトル */
h2 {
  margin-bottom: 25px;
  letter-spacing: 2px;
}

/* テキスト */
p {
  line-height: 2;
  color: #ddd;
  font-size: 15px;
}

/* スマホ */
@media (max-width: 768px) {
  .main {
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <a href="portfolio.html">PORTFOLIO</a>
  <a href="index.html">TOP</a>
  <a href="about.html" style="font-weight:700;">ABOUT</a>
</header>

<div class="main">
  <div class="card">
    <h2>ABOUT</h2>

    <p>
      ご覧いただきありがとうございます。<br><br>

      日々、写真の撮影と編集を行っています。<br><br>

      このサイトでは、<br>
      これまでに撮影した作品をまとめています。
    </p>

  </div>
</div>

</body>
</html>
``
